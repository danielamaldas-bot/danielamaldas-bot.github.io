<style>

<script>
'use strict';
/* ============================================================
   VEL AND THE SHAMI SECRET — The Hidden Year
   The Thirteenth Year, retold top-down in NES Zelda style.
   Same Vel, same dog, same boars & hawks, same Vaka.
   All art redrawn in code, top-down, from the original designs.
   ============================================================ */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const TILE=16,COLS=16,ROWS=11,PW=256,PH=176,HUD=64,VH=240;
// palette lifted from The Thirteenth Year (P in sprites.js)
const C={
  ink:'#101018',hudText:'#efeae0',
  skin:'#a0612c',skinD:'#5e3214',hair:'#16121e',saf:'#ee8a1c',safD:'#c25e0a',safDk:'#7a3606',
  gold:'#f2c632',goldL:'#fff2a0',wood:'#8a5e32',woodD:'#5a3818',
  steel:'#d4def0',steelD:'#8a9ab4',
  dog:'#cdd0d8',dogD:'#6a6e7a',dogN:'#3a3e48',
  boar:'#3c2e40',boarD:'#1e1720',boarL:'#86708e',snout:'#a87080',tusk:'#f4f0e4',
  crow:'#1e2644',crowD:'#0c0e1c',crowL:'#5c74b8',beak:'#f2c632',
  vaka:'#356250',vakaD:'#1f3a32',vakaL:'#5f9472',belly:'#8aa862',cloth:'#86223a',
  red:'#e03a3a',redD:'#a01822',
  leaf:'#4aa232',leafD:'#246a1c',leafDk:'#10300c',
  grass:'#3f9e3a',grassD:'#35822f',grassL:'#55b34c',
  dirt:'#c8a165',dirtD:'#a87f4c',sand:'#e0c184',
  water:'#2b5fd9',waterD:'#1c3f9e',waterL:'#6ea8ff',
  rock:'#6e6882',rockD:'#46404f',rockL:'#9c96b0',
  wall:'#5c5c6e',wallD:'#37374a',wallL:'#8a8aa0',floor:'#2e2e3e',floorD:'#262633',
  cave:'#0b0b10'
};
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h));}
function hash(x,y){let n=(x*374761393+y*668265263)^0x5bf03635;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967295;}

/* ------------- AUDIO: generic in-code chiptune + sfx synth -------------
   No external tracks. Three original NES-style loops (overworld / dungeon /
   boss) sequenced live with square + triangle waves.                     */
let muted=false,musicMode=null,AC=null;
const mf=m=>440*Math.pow(2,(m-69)/12);
const TRACKS={
  stage:{spb:.21, // seconds per eighth-note step
    mel:[62,66,69,66,74,69,66,64, 62,66,69,66,74,76,74,69, 71,69,66,64,62,64,66,64, 62,0,66,69,74,0,69,0],
    bas:[38,0,45,0,43,0,45,0, 38,0,45,0,43,0,45,0, 40,0,47,0,38,0,45,0, 50,0,45,0,43,0,45,0]},
  dungeon:{spb:.27,
    mel:[50,0,53,0,49,0,50,0, 46,0,49,0,48,0,0,0, 50,0,53,0,55,53,50,49, 46,0,0,0,48,0,0,0],
    bas:[26,0,0,0,29,0,0,0, 26,0,0,0,24,0,0,0, 26,0,0,0,29,0,0,0, 31,0,29,0,24,0,0,0]},
  boss:{spb:.155,
    mel:[62,62,65,62,68,65,62,61, 62,62,65,62,70,68,65,64, 62,62,65,62,68,65,62,61, 74,0,73,0,70,0,68,64],
    bas:[38,38,45,38,38,38,45,38, 41,41,48,41,38,38,45,38, 38,38,45,38,38,38,45,38, 43,43,45,45,46,46,45,43]}
};
let musStep=0,musNext=0;
function setMusic(mode){if(mode!==musicMode){musicMode=mode;musStep=0;musNext=0;}}
function musicTick(){
  if(muted||!musicMode)return;const a=AC;if(!a)return;const tr=TRACKS[musicMode];if(!tr)return;
  const now=a.currentTime;if(musNext<now)musNext=now+.05;
  while(musNext<now+.14){
    const i=musStep%tr.mel.length,m=tr.mel[i],b=tr.bas[i%tr.bas.length],t=musNext;
    if(m)noteAt(mf(m),t,tr.spb*.92,'square',.045);
    if(b)noteAt(mf(b),t,tr.spb*1.8,'triangle',.075);
    if(musicMode==='boss'&&i%2===0)noiseAt(t,.03,.02);
    musNext+=tr.spb;musStep++;
  }
}
function noteAt(freq,t,dur,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noiseAt(t,dur,vol){
  const len=Math.max(1,(AC.sampleRate*dur)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;const g=AC.createGain();g.gain.value=vol;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=4000;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f0,f1,dur,type,vol,delay){
  if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol||.12,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  swing(){tone(700,180,.09,'square',.07);},
  block(){tone(1800,1400,.06,'square',.1);tone(2400,2000,.05,'square',.07,.02);},
  shoot(){tone(300,900,.08,'square',.08);},
  hit(){tone(220,90,.08,'sawtooth',.12);},
  die(){tone(400,60,.25,'square',.12);},
  hurt(){tone(160,60,.2,'sawtooth',.14);},
  pickup(){tone(660,660,.07,'square',.1);tone(990,990,.12,'square',.1,.07);},
  coin(){tone(990,990,.06,'square',.09);tone(1320,1320,.14,'square',.09,.06);},
  key(){[523,659,784,1046].forEach((f,i)=>tone(f,f,.1,'square',.1,i*.08));},
  door(){tone(90,50,.3,'sawtooth',.14);},
  secret(){[392,523,659,784].forEach((f,i)=>tone(f,f,.12,'triangle',.12,i*.09));},
  roar(){tone(70,40,.6,'sawtooth',.2);tone(55,35,.7,'sawtooth',.16,.1);},
  bark(){tone(300,150,.07,'square',.06);tone(320,160,.07,'square',.06,.1);},
  fanfare(){[523,523,523,659,784,1046,784,1046].forEach((f,i)=>tone(f,f,.16,'square',.11,i*.13));}
};

/* ---------------- OVERWORLD MAPS (3x3 screens) ----------------
   T tree · t lone tree · R rock · W water · B bridge · C cave door
   S shami door · G shami trunk · L shami canopy · . grass · p path
   f flowers · s sand                                            */
function M(rows){return rows.map(r=>(r+'................').slice(0,16).split(''));}
const OW=[
 [ // row 0 (north)
  M(["TTTTTTT..TTTTTTT",
     "T..t......t....T",
     "T.....ggg......T",
     "T..t..ggg...t..T",
     "T......ggg.....T",
     ".....t......t...",
     "T..t......t....T",
     "T.....t........T",
     "T..t......t..t.T",
     "T........t.....T",
     "TTTTTTT..TTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "TWWWWWW..WWWW..T",
     "TWWWWW.......t.T",
     ".WWWW...t.......",
     "..WW....t....t.T",
     "....p...........",
     "T..t..p....t...T",
     "T.....p........T",
     "T..t.....t...t.T",
     "T........t.....T",
     "TTTTTTT..TTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "T.....LLLL.....T",
     "T....LLLLLL....T",
     "T....LLGGLL....T",
     "T.....GSG......T",
     "......G.....t...",
     "T..t......t....T",
     "T.....t........T",
     "T..t..RRR...t..T",
     "T.....RRR......T",
     "TTTTTTT..TTTTTTT"])
 ],
 [ // row 1
  M(["TTTTTTT..TTTTTTT",
     "T..f....f......T",
     "T.....t....f...T",
     "T.f......t.....T",
     "T....t.......f.T",
     "..f.............",
     "T.....t....f...T",
     "T..f......t....T",
     "T....f...t...f.T",
     "T..t...........T",
     "TTTTTTT..TTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "T.......t......T",
     "T..t...........T",
     "T..............T",
     "TWWWWWWBBWWWW..T",
     ".WWWWWWBBWWWW...",
     "TWWWWWWBBWWWWWWT",
     "T..............T",
     "T..t........t..T",
     "T...........t..T",
     "TTTTTTT..TTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "T.RRR......RR..T",
     "T.RRRR..t..RRR.T",
     "T..RR..........T",
     "....R....RRR....",
     "..........RRR...",
     "T.RR....t......T",
     "T..RRR......t..T",
     "T...RR..t......T",
     "T......RRR...t.T",
     "TTTTTTT..TTTTTTT"])
 ],
 [ // row 2 (south) — start screen bottom-left, cave west rocks
  M(["TTTTTTT..TTTTTTT",
     "T.RRRR.........T",
     "T.RCRR....t....T",
     "T.R.RR.........T",
     "T.........t....T",
     "..........p.....",
     "T..t......p..t.T",
     "T......t..p....T",
     "T..t......p....T",
     "T....t.........T",
     "TTTTTTTTTTTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "T......p.......T",
     "T..t...p...t...T",
     "T......p.......T",
     "T...t..p....t..T",
     ".......pp.......",
     "T..t...p.......T",
     "T......p...t...T",
     "T.t....p.......T",
     "T......p....t..T",
     "TTTTTTTTTTTTTTTT"]),
  M(["TTTTTTT..TTTTTTT",
     "T..........ssWWT",
     "T..t......ssWWWT",
     "T........ssWWWWW",
     "T..t....ssWWWWWW",
     "........ssWWWWWW",
     "T..t...ssWWWWWT.",
     "T.....ssWWWWW..T",
     "T..t.ssWWWWW...T",
     "T....sWWWW.....T",
     "TTTTTTTTTTTTTTTT"])
 ]
];
// spawns per screen: [type, tileX, tileY]
const OW_ENEMIES={
 '0,0':[['boar',4,5],['boar',11,7]],
 '1,0':[['hawk',8,3],['boar',12,7]],
 '2,0':[['boar',3,7],['boar',12,6],['hawk',9,3]],
 '0,1':[['boar',5,3],['boar',10,7]],
 '1,1':[['boar',4,8],['hawk',11,2]],
 '2,1':[['hawk',5,3],['hawk',11,6],['boar',8,8]],
 '0,2':[],
 '1,2':[['boar',5,4],['boar',11,6]],
 '2,2':[['boar',4,5],['hawk',10,3]]
};
const OW_PICKUPS={
 '0,0':[['coin',8,2],['coin',9,2],['coin',8,3]],
 '0,1':[['heart',13,2]],
 '1,0':[['arrows',13,7]],
 '2,1':[['coin',8,4],['coin',8,5]],
 '1,2':[['coin',3,8]],
 '2,2':[['heart',3,3]]
};
const SOLID=new Set(['T','t','R','W','G','L']);
function owTile(sx,sy,tx,ty){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return '.'; // open void past the edge — screen logic clamps or slides
  return OW[sy][sx][ty][tx];
}
function owSolid(sx,sy,tx,ty){
  const t=owTile(sx,sy,tx,ty);
  if(t==='C'||t==='S')return false; // doors are triggers, handled on touch
  return SOLID.has(t);
}

<script>
'use strict';
/* ---------------- DUNGEON: THE SHAMI VAULT (3 x 2 rooms) ----------------
   (0,0) Map room   (1,0) BOSS VAKA   (2,0) Reward — Astra shard
   (0,1) Entrance   (1,1) Hall        (2,1) Key room                  */
const DUNG={
 '0,0':{doors:{S:'open'},blocks:[[3,3],[4,3],[3,4],[11,6],[12,6],[12,7],[6,8],[7,8]],foes:[['boar',4,7],['boar',11,3]],item:'map'},
 '1,0':{doors:{S:'locked',E:'boss'},blocks:[[2,2],[13,2],[2,8],[13,8]],foes:[],boss:true},
 '2,0':{doors:{W:'boss'},blocks:[[7,2],[8,2],[7,8],[8,8]],foes:[],item:'shard'},
 '0,1':{doors:{N:'open',E:'open',S:'exit'},blocks:[[3,3],[12,3],[3,8],[12,8]],foes:[]},
 '1,1':{doors:{W:'open',E:'open',N:'locked'},blocks:[[4,3],[11,3],[4,7],[11,7],[7,5],[8,5]],foes:[['boar',5,5],['boar',10,5],['hawk',8,2]]},
 '2,1':{doors:{W:'open'},blocks:[[5,2],[10,2],[5,8],[10,8],[7,4],[8,6]],foes:[['boar',6,5],['boar',9,3],['boar',8,7]],keyRoom:true}
};
function dungTile(rx,ry,tx,ty){
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return '#';
  const room=DUNG[rx+','+ry];if(!room)return '#';
  const doorAt=(d,tx,ty)=>{ // returns door type or null
    if(d==='N'&&ty===0&&(tx===7||tx===8))return room.doors.N;
    if(d==='S'&&ty===ROWS-1&&(tx===7||tx===8))return room.doors.S;
    if(d==='W'&&tx===0&&ty===5)return room.doors.W;
    if(d==='E'&&tx===COLS-1&&ty===5)return room.doors.E;
    return undefined;
  };
  for(const d of['N','S','W','E']){const v=doorAt(d,tx,ty);if(v!==undefined)return 'D:'+v;}
  if(tx===0||ty===0||tx===COLS-1||ty===ROWS-1)return '#';
  for(const b of room.blocks)if(b[0]===tx&&b[1]===ty)return 'B';
  return '.';
}
function dungSolid(rx,ry,tx,ty){
  const t=dungTile(rx,ry,tx,ty);
  return t==='#'||t==='B';
}

/* ---------------- GAME STATE ---------------- */
const G={
  state:'title', // title | story | play | over | win
  paused:false, t:0, storyT:0,
  area:'over', sx:0, sy:2, rx:0, ry:1,
  trans:null, msg:null, pickupFx:null,
  bossDead:false, shardGot:false, mapGot:false, keyGot:false, bossSealed:false,
  visited:{}, sparks:[]
};
const P={ // Vel
  x:8*TILE,y:7*TILE,w:12,h:12,dir:'down',frame:0,moving:false,
  hp:6,maxhp:6,coins:0,arrows:0,keys:0,
  hasSword:false,hasShield:false,hasBow:false,
  swing:0,swingCD:0,shootCD:0,invuln:0,kbx:0,kby:0
};
const DOG={x:7*TILE,y:7*TILE,w:12,h:10,dir:'down',frame:0,hist:[],barkT:4};
let enemies=[],projs=[],eprojs=[],pickups=[],bossRef=null;

function resetGame(){
  G.state='play';G.paused=false;G.area='over';G.sx=0;G.sy=2;G.rx=0;G.ry=1;
  G.trans=null;G.msg=null;G.pickupFx=null;G.bossDead=false;G.shardGot=false;
  G.mapGot=false;G.keyGot=false;G.bossSealed=false;G.visited={};G.sparks=[];G.unlocked=new Set();G.keyPending=false;
  Object.assign(P,{x:8*TILE,y:7*TILE,dir:'down',hp:6,maxhp:6,coins:0,arrows:0,keys:0,
    hasSword:false,hasShield:false,hasBow:false,swing:0,swingCD:0,shootCD:0,invuln:0,kbx:0,kby:0});
  DOG.x=P.x-18;DOG.y=P.y+6;DOG.hist=[];
  loadScreen();
  setMusic('stage');
}
function showMsg(text,dur){G.msg={text:text,t:dur||3};}
function curKey(){return G.area==='over'?('o'+G.sx+','+G.sy):G.area==='cave'?'cave':('d'+G.rx+','+G.ry);}

function loadScreen(){
  enemies=[];projs=[];eprojs=[];pickups=[];bossRef=null;G.sparks=[];
  if(G.area==='over'){
    const k=G.sx+','+G.sy;
    for(const s of(OW_ENEMIES[k]||[]))spawnFoe(s[0],s[1]*TILE+2,s[2]*TILE+2);
    for(const s of(OW_PICKUPS[k]||[]))pickups.push({kind:s[0],x:s[1]*TILE+3,y:s[2]*TILE+3,t:Math.random()*6});
  }else if(G.area==='dung'){
    const k=G.rx+','+G.ry,room=DUNG[k];G.visited[k]=true;
    if(room){
      for(const s of room.foes)spawnFoe(s[0],s[1]*TILE+2,s[2]*TILE+2);

      if(room.item==='shard'&&!G.shardGot)pickups.push({kind:'shard',x:8*TILE,y:4*TILE,t:0,stand:true});
      if(room.keyRoom&&!G.keyGot)G.keyPending=true;else G.keyPending=false;

/* ---------------- COLLISION ---------------- */
function doorPairId(rx,ry,tx,ty){
  if(ty===0)return 'V'+rx+','+(ry-1)+'-'+rx+','+ry;
  if(ty===ROWS-1)return 'V'+rx+','+ry+'-'+rx+','+(ry+1);
  if(tx===0)return 'H'+(rx-1)+','+ry+'-'+rx+','+ry;
  return 'H'+rx+','+ry+'-'+(rx+1)+','+ry;
}
function tileSolidAt(px,py){
  const tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(G.area==='over')return owSolid(G.sx,G.sy,tx,ty);
  if(G.area==='dung'){
    const t=dungTile(G.rx,G.ry,tx,ty);
    if(typeof t==='string'&&t.indexOf('D:')===0){
      const kind=t.slice(2);
      if(kind==='locked'){
        if(G.bossSealed&&G.rx===1&&G.ry===0&&!G.bossDead&&ty===ROWS-1)return true; // sealed behind Vel
        return !(G.unlocked&&G.unlocked.has(doorPairId(G.rx,G.ry,tx,ty)));
      }
      if(kind==='boss')return !G.bossDead;
      return false; // open / exit doors are walkable
    }
    return dungSolid(G.rx,G.ry,tx,ty);
  }
  // cave interior
  if(ty>=ROWS-1&&(tx===7||tx===8))return false; // exit gap in the south wall
  if(tx<1||ty<1||tx>=COLS-1||ty>=ROWS-1)return true;
  if(ty===2&&tx>=7&&tx<=8)return true; // elder dais
  return false;
}
function boxFree(x,y,w,h){
  return !tileSolidAt(x+2,y+4)&&!tileSolidAt(x+w-3,y+4)&&!tileSolidAt(x+2,y+h-3)&&!tileSolidAt(x+w-3,y+h-3);
}
function moveBox(o,dx,dy){
  if(dx!==0&&boxFree(o.x+dx,o.y,o.w,o.h))o.x+=dx;else if(dx!==0)o.kbx=0;
  if(dy!==0&&boxFree(o.x,o.y+dy,o.w,o.h))o.y+=dy;else if(dy!==0)o.kby=0;
}
function overlap(a,b,pad){
  pad=pad||0;
  return a.x-pad<b.x+b.w&&a.x+a.w+pad>b.x&&a.y-pad<b.y+b.h&&a.y+a.h+pad>b.y;
}

function damageFoe(e,dmg,fx,fy){
  e.hp-=dmg;e.flash=.18;SFX.hit();
  const dx=(e.x+e.w/2)-fx,dy=(e.y+e.h/2)-fy,m=Math.hypot(dx,dy)||1;
  e.kbx=dx/m*120;e.kby=dy/m*120;
  if(e.hp<=0&&!e.dead){e.dead=true;SFX.die();killFoe(e);}
}
function killFoe(e){
  for(let i=0;i<8;i++)G.sparks.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*70,t:.35,c:'#fff'});
  if(e.type==='vaka'){
    G.bossDead=true;G.bossSealed=false;bossRef=null;setMusic('dungeon');SFX.roar();
    showMsg('VAKA FALLS! THE VAULT BREATHES AGAIN.',3);
    pickups.push({kind:'container',x:e.x+8,y:e.y+8,t:0});
    return;
  }
  const r=Math.random();
  let kind=null;
  if(r<.22)kind=Math.random()<.7?'coin':'gem';
  else if(r<.4)kind='heart';
  else if(r<.55&&P.hasBow)kind='arrows';
  if(kind)pickups.push({kind:kind,x:e.x+2,y:e.y+2,t:0});
  if(G.area==='dung'&&G.keyPending&&enemies.every(en=>en.dead)){
    G.keyPending=false;SFX.secret();
    pickups.push({kind:'key',x:8*TILE-5,y:5*TILE,t:0});
    showMsg('A SMALL KEY CLATTERS TO THE STONE!',2.6);
  }
}
function update(dt){
  G.t+=dt;musicTick();
  if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null;}
  msgCD=Math.max(0,msgCD-dt);barkFx=Math.max(0,barkFx-dt);
  for(const s of G.sparks){s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}
  G.sparks=G.sparks.filter(s=>s.t>0);
  if(G.state!=='play'||G.paused)return;
  // transitions animate but freeze gameplay
  if(G.trans){
    const tr=G.trans;tr.t+=dt;
    if(tr.type==='fade'&&!tr.done&&tr.t>=tr.dur/2){tr.done=true;tr.fn();}
    if(tr.t>=tr.dur){
      if(tr.type==='slide'){finishSlide(tr);}
      G.trans=null;
    }
    return;
  }
  if(G.pickupFx){G.pickupFx.t+=dt;if(G.pickupFx.t>=G.pickupFx.dur)G.pickupFx=null;return;}
  updatePlayer(dt);updateDog(dt);
  for(const e of enemies)if(!e.dead)updateFoe(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  updateProjs(dt);
  for(const p of pickups)p.t+=dt;
  checkPickups();
  checkTriggers();
}
function updatePlayer(dt){
  P.swingCD=Math.max(0,P.swingCD-dt);P.shootCD=Math.max(0,P.shootCD-dt);
  P.swing=Math.max(0,P.swing-dt);P.invuln=Math.max(0,P.invuln-dt);
  let dx=0,dy=0;
  if(keys.u)dy-=1;if(keys.d)dy+=1;if(keys.l)dx-=1;if(keys.r)dx+=1;
  P.moving=!!(dx||dy);
  if(dx&&dy)dy=0; // 4-way like the original
  if(dx)P.dir=dx<0?'left':'right';else if(dy)P.dir=dy<0?'up':'down';
  if(P.moving)P.frame+=dt*9;
  const spd=82;
  let mx=dx*spd*dt+P.kbx*dt,my=dy*spd*dt+P.kby*dt;
  P.kbx*=Math.pow(.001,dt);P.kby*=Math.pow(.001,dt);
  if(Math.abs(P.kbx)<4)P.kbx=0;if(Math.abs(P.kby)<4)P.kby=0;
  // locked/boss door interaction: pushing into one
  if(G.area==='dung'&&(dx||dy))dungDoorPush(dx,dy);
  moveBox(P,mx,my);
  // attacks
  if((keys.strike)&&P.hasSword&&P.swingCD<=0){
    P.swing=.18;P.swingCD=.32;swingHitSet=new Set();SFX.swing();
  }
  if(P.swing>0){
    const v=DIRV[P.dir],hb={x:P.x+6+v[0]*13-6,y:P.y+6+v[1]*13-6,w:13,h:13};
    for(const e of enemies){
      if(e.dead||swingHitSet.has(e))continue;
      if(overlap(hb,e,-2)){swingHitSet.add(e);damageFoe(e,1,P.x+6,P.y+6);}
    }
    for(const pr of eprojs){if(!pr.dead&&overlap(hb,pr,-1)){pr.dead=true;SFX.hit();for(let i=0;i<4;i++)G.sparks.push({x:pr.x+3,y:pr.y+3,vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*60,t:.25,c:'#ffe070'});}}
  }
  if(keys.shoot&&P.hasBow&&P.shootCD<=0){
    if(P.arrows>0){
      P.arrows--;P.shootCD=.26;SFX.shoot();
      const v=DIRV[P.dir];
      projs.push({x:P.x+5+v[0]*10,y:P.y+5+v[1]*10,w:5,h:5,vx:v[0]*215,vy:v[1]*215,dir:P.dir,dead:false});
    }else if(msgCD<=0){showMsg('NO ARROWS — THE SWORD WILL DO.',1.6);msgCD=2;}
  }
  // dungeon boss-room door seals behind Vel
  if(G.area==='dung'&&G.bossSealed&&bossRef&&!bossRef.dead){
    // south door tile acts solid while sealed (handled in dungSolid via state check below)
  }
}
function dungDoorPush(dx,dy){
  const cx=P.x+P.w/2+dx*10,cy=P.y+P.h/2+dy*10;
  const tx=Math.floor(cx/TILE),ty=Math.floor(cy/TILE);
  const t=dungTile(G.rx,G.ry,tx,ty);
  if(t==='D:locked'){
    const id=doorPairId(G.rx,G.ry,tx,ty);
    if(G.unlocked&&G.unlocked.has(id))return;
    if(P.keys>0){
      P.keys--;(G.unlocked=G.unlocked||new Set()).add(id);SFX.door();showMsg('THE SMALL KEY TURNS. THE DOOR GRINDS OPEN.',2.2);
    }else if(msgCD<=0){showMsg('LOCKED. A SMALL KEY WOULD OPEN IT.',1.8);msgCD=2;}
  }else if(t==='D:boss'&&!G.bossDead&&msgCD<=0){
    showMsg('SEALED BY VAKA\u2019S BANNER. HE MUST FALL FIRST.',1.8);msgCD=2;
  }
}
function updateDog(dt){
  DOG.hist.unshift({x:P.x,y:P.y});
  if(DOG.hist.length>70)DOG.hist.pop();
  const target=DOG.hist[Math.min(26,DOG.hist.length-1)]||P;
  const dx=target.x-DOG.x,dy=target.y-DOG.y,dist=Math.hypot(dx,dy);
  if(dist>170){DOG.x=P.x-14;DOG.y=P.y+10;DOG.hist=[];}
  else if(dist>13){
    const sp=Math.min(150,40+dist*3.4);
    const ox=DOG.x,oy=DOG.y;
    moveBox(DOG,dx/dist*sp*dt,dy/dist*sp*dt);
    if(Math.abs(DOG.x-ox)<.01&&Math.abs(DOG.y-oy)<.01){DOG.x+=dx/dist*sp*dt;DOG.y+=dy/dist*sp*dt;} // slip around corners
    DOG.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
    DOG.frame+=dt*10;
  }
  DOG.barkT-=dt;
  const nearFoe=enemies.some(e=>!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<80);
  if(DOG.barkT<=0){DOG.barkT=nearFoe?2.5+Math.random()*3:6+Math.random()*9;barkFx=.8;SFX.bark();}
}
function updateFoe(e,dt){
  e.t+=dt;e.flash=Math.max(0,e.flash-dt);
  if(e.kbx||e.kby){moveBox(e,e.kbx*dt,e.kby*dt);e.kbx*=Math.pow(.001,dt);e.kby*=Math.pow(.001,dt);if(Math.abs(e.kbx)<4)e.kbx=0;if(Math.abs(e.kby)<4)e.kby=0;}
  const pcx=P.x+6,pcy=P.y+6,ecx=e.x+e.w/2,ecy=e.y+e.h/2;
  const distP=Math.hypot(pcx-ecx,pcy-ecy);
  if(e.type==='boar'){
    e.st-=dt;
    e.x=Math.max(0,Math.min(PW-e.w,e.x));e.y=Math.max(0,Math.min(PH-e.h,e.y));
    if(e.state==='wander'){
      if(e.st<=0){e.st=1+Math.random()*1.6;e.vx=(Math.random()<.5?-1:1)*(Math.random()<.6?1:0);e.vy=e.vx?0:(Math.random()<.5?-1:1);if(!e.vx&&!e.vy)e.vx=1;}
      moveBox(e,e.vx*24*dt,e.vy*24*dt);
      if(e.vx)e.face=e.vx;
      const aligned=(Math.abs(pcy-ecy)<11&&distP<95)||(Math.abs(pcx-ecx)<11&&distP<95);
      if(aligned&&distP>16){e.state='tell';e.st=.45;e.face=pcx>ecx?1:-1;e.chargeX=Math.abs(pcy-ecy)<11?Math.sign(pcx-ecx):0;e.chargeY=Math.abs(pcy-ecy)<11?0:Math.sign(pcy-ecy);}
    }else if(e.state==='tell'){
      e.face=pcx>ecx?1:-1;
      if(e.st<=0){e.state='charge';e.st=.55;}
    }else if(e.state==='charge'){
      e.face=e.chargeX||e.face;
      moveBox(e,(e.chargeX||0)*138*dt,(e.chargeY||0)*138*dt);
      if(e.st<=0){e.state='wander';e.st=.6;}
    }
  }else if(e.type==='hawk'){
    e.st-=dt;
    if(e.state==='wander'){ // hover above Vel
      const tx=P.x,ty=P.y-48;
      const dx=tx-e.x,dy=ty-e.y,m=Math.hypot(dx,dy)||1;
      if(m>2){e.x+=dx/m*62*dt;e.y+=dy/m*62*dt;}
      e.homeGroundY=Math.min(PH-8,e.y+36);
      if(e.st<=0&&distP<120){e.state='swoop';e.st=.55;const d2=Math.hypot(pcx-ecx,pcy-ecy)||1;e.vx=(pcx-ecx)/d2*168;e.vy=(pcy-ecy)/d2*168;}
      else if(e.st<=-2)e.st=1+Math.random();
    }else if(e.state==='swoop'){
      e.x+=e.vx*dt;e.y+=e.vy*dt;e.homeGroundY=e.y+8;
      if(e.st<=0){e.state='wander';e.st=1.4+Math.random()*1.4;}
    }
    e.x=Math.max(0,Math.min(PW-e.w,e.x));e.y=Math.max(0,Math.min(PH-e.h,e.y));
  }else if(e.type==='vaka'){
    updateBoss(e,dt,distP,pcx,pcy,ecx,ecy);
  }
  // contact damage (shield never blocks touch)
  if(!e.dead&&overlap(P,e,-3)){
    hurtPlayer(e.type==='vaka'?2:1,ecx,ecy);
    if(e.type==='boar'&&e.state==='charge'){e.state='wander';e.st=.8;}
  }
}
function updateBoss(b,dt,distP,pcx,pcy,ecx,ecy){
  b.st-=dt;b.throwT-=dt;
  if(b.state==='stalk'){
    const dx=pcx-ecx,dy=pcy-ecy,m=Math.hypot(dx,dy)||1;
    if(distP>34)moveBox(b,dx/m*27*dt,dy/m*27*dt);
    if(b.throwT<=0&&distP>60){b.state='throw';b.st=.5;}
    else if(b.st<=0&&distP<130){b.state='tell';b.st=.62;const d2=m||1;b.chargeX=dx/d2;b.chargeY=dy/d2;}
  }else if(b.state==='tell'){
    b.x+= (Math.random()-0.5)*1.4; // telegraph shudder
    if(b.st<=0){b.state='charge';b.st=.62;SFX.roar();}
  }else if(b.state==='charge'){
    moveBox(b,b.chargeX*172*dt,b.chargeY*172*dt);
    if(b.st<=0){b.state='rest';b.st=.85;}
  }else if(b.state==='throw'){
    if(b.st<=0){
      b.state='stalk';b.st=1.5+Math.random();b.throwT=2.6+Math.random()*1.6;
      const dx=pcx-ecx,dy=pcy-ecy,m=Math.hypot(dx,dy)||1;
      eprojs.push({x:ecx-3,y:ecy-3,w:7,h:7,vx:dx/m*112,vy:dy/m*112,dead:false,rock:true});
      SFX.shoot();
    }
  }else if(b.state==='rest'){
    if(b.st<=0){b.state='stalk';b.st=1.2+Math.random()*0.9;}
  }
}
function updateProjs(dt){
  for(const pr of projs){
    pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
    if(pr.x<-6||pr.y<-6||pr.x>PW||pr.y>PH)pr.dead=true;
    else if(tileSolidAt(pr.x+2,pr.y+2))pr.dead=true;
    else for(const e of enemies){if(!e.dead&&overlap(pr,e,-1)){pr.dead=true;damageFoe(e,1,pr.x-pr.vx*.1,pr.y-pr.vy*.1);break;}}
  }
  projs=projs.filter(p=>!p.dead);
  for(const pr of eprojs){
    pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
    if(pr.x<-8||pr.y<-8||pr.x>PW||pr.y>PH)pr.dead=true;
    else if(tileSolidAt(pr.x+3,pr.y+3))pr.dead=true;
    else if(!pr.dead&&overlap(pr,P,-2)){
      // SHIELD: blocks frontal projectiles while Vel is not mid-swing
      const v=DIRV[P.dir];
      const frontal=(v[0]!==0&&Math.sign(pr.vx)===-v[0])||(v[1]!==0&&Math.sign(pr.vy)===-v[1]);
      if(P.hasShield&&P.swing<=0&&frontal){
        pr.dead=true;SFX.block();
        for(let i=0;i<5;i++)G.sparks.push({x:pr.x+3,y:pr.y+3,vx:(Math.random()-0.5)*70,vy:(Math.random()-0.5)*70,t:.22,c:'#ffe070'});
      }else if(P.swing>0){
        pr.dead=true;SFX.hit();
      }else{
        pr.dead=true;hurtPlayer(1,pr.x,pr.y);
      }
    }
  }
  eprojs=eprojs.filter(p=>!p.dead);
}
function checkPickups(){
  const pb={x:P.x,y:P.y,w:P.w,h:P.h};
  for(const p of pickups){
    if(p.got)continue;
    const box={x:p.x-2,y:p.y-2,w:15,h:15};
    if(overlap(pb,box,-2)){
      p.got=true;
      if(p.kind==='heart'){P.hp=Math.min(P.maxhp,P.hp+2);SFX.pickup();}
      else if(p.kind==='coin'){P.coins+=1;SFX.coin();}
      else if(p.kind==='gem'){P.coins+=5;SFX.coin();}
      else if(p.kind==='arrows'){P.arrows=Math.min(24,P.arrows+4);SFX.pickup();}
      else if(p.kind==='key'){P.keys++;G.keyGot=true;SFX.key();showMsg('GOT A SMALL KEY!',2);}
      else if(p.kind==='map'){G.mapGot=true;SFX.secret();showMsg('GOT THE SHAMI MAP! THE VAULT UNFOLDS.',2.6);}
      else if(p.kind==='container'){P.maxhp=Math.min(16,P.maxhp+2);P.hp=P.maxhp;SFX.fanfare();showMsg('A HEART CONTAINER! VEL STANDS TALLER.',2.6);}
      else if(p.kind==='shard'){G.shardGot=true;SFX.fanfare();winGame();}
    }
  }
  pickups=pickups.filter(p=>!p.got);
}
function winGame(){
  G.state='win';setMusic('stage');
}
function checkTriggers(){
  const cx=P.x+P.w/2,cy=P.y+P.h/2;
  const tx=Math.floor(cx/TILE),ty=Math.floor(cy/TILE);
  if(G.area==='over'){
    const t=owTile(G.sx,G.sy,tx,ty);
    if(t==='C'){enterCave();return;}
    if(t==='S'){enterDungeon();return;}
    // screen edges -> slide transitions
    let dir=null;
    if(P.x<=-4&&G.sx>0)dir='left';else if(P.x>=PW-P.w+4&&G.sx<2)dir='right';
    else if(P.y<=-4&&G.sy>0)dir='up';else if(P.y>=PH-P.h+4&&G.sy<2)dir='down';
    else{P.x=Math.max(-2,Math.min(PW-P.w+2,P.x));P.y=Math.max(-2,Math.min(PH-P.h+2,P.y));return;}
    const osx=G.sx,osy=G.sy;
    const nsx=osx+(dir==='left'?-1:dir==='right'?1:0),nsy=osy+(dir==='up'?-1:dir==='down'?1:0);
    const fromX=P.x,fromY=P.y;
    const toX=dir==='left'?PW-P.w-4:dir==='right'?4:fromX;
    const toY=dir==='up'?PH-P.h-4:dir==='down'?4:fromY;
    slideTo(dir,tr=>{
      tr.kind='over';tr.osx=osx;tr.osy=osy;tr.nsx=nsx;tr.nsy=nsy;
      tr.fx=fromX;tr.fy=fromY;tr.tx=toX;tr.ty=toY;
      G.sx=nsx;G.sy=nsy;
    });
    return;
  }
  if(G.area==='cave'){
    if(P.y>=148&&(tx===7||tx===8)){exitCave();return;}
    if(!P.hasSword&&P.y<4.4*TILE&&Math.abs(cx-8*TILE)<34){
      P.hasSword=true;P.hasShield=true;P.hasBow=true;P.arrows=12;
      G.pickupFx={t:0,dur:2.4};SFX.fanfare();
    }
    return;
  }
  if(G.area==='dung'){
    const t=dungTile(G.rx,G.ry,tx,ty);
    if(t==='D:exit'){exitDungeon();return;}
    let dir=null;
    if(typeof t==='string'&&t.indexOf('D:')===0){
      if(ty===0)dir='up';else if(ty===ROWS-1)dir='down';else if(tx===0)dir='left';else if(tx===COLS-1)dir='right';
    }
    if(dir){
      const orx=G.rx,ory=G.ry;
      const nrx=orx+(dir==='left'?-1:dir==='right'?1:0),nry=ory+(dir==='up'?-1:dir==='down'?1:0);
      if(!DUNG[nrx+','+nry])return;
      const fromX=P.x,fromY=P.y;
      const toX=dir==='left'?PW-P.w-20:dir==='right'?20:fromX;
      const toY=dir==='up'?PH-P.h-20:dir==='down'?20:fromY;
      slideTo(dir,tr=>{
        tr.kind='dung';tr.orx=orx;tr.ory=ory;tr.nrx=nrx;tr.nry=nry;
        tr.fx=fromX;tr.fy=fromY;tr.tx=toX;tr.ty=toY;
        G.rx=nrx;G.ry=nry;
      });
      if(nry===0&&nrx===1&&!G.bossDead)setMusic('boss');
    }
  }
}
function finishSlide(tr){
  P.x=tr.tx;P.y=tr.ty;
  if(tr.kind==='over'){G.sx=tr.nsx;G.sy=tr.nsy;}
  else{G.rx=tr.nrx;G.ry=tr.nry;}
  loadScreen();
  if(G.area==='dung'&&!(G.rx===1&&G.ry===0))setMusic('dungeon');
  if(G.area==='over')setMusic('stage');
}
</script>
<script>
'use strict';
/* ================= RENDER ================= */
function drawOverTiles(sx,sy,ox,oy){
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)
    drawTileOver(OW[sy][sx][ty][tx],ox+tx*TILE,oy+HUD+ty*TILE,tx,ty);
}
function drawDungTiles(rx,ry,ox,oy){
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++)
    drawTileDung(dungTile(rx,ry,tx,ty),ox+tx*TILE,oy+HUD+ty*TILE,tx,ty);
}
function drawCaveTiles(ox,oy){
  R(ox,oy+HUD,PW,PH,'#06060a');
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const px=ox+tx*TILE,py=oy+HUD+ty*TILE;
    if(tx===0||ty===0||tx===COLS-1||ty===ROWS-1){
      if(ty===ROWS-1&&(tx===7||tx===8)){R(px,py,16,16,'#06060a');continue;}
      R(px,py,16,16,C.wallD);R(px+1,py+1,14,6,C.wall);R(px+1,py+9,14,6,C.wall);
    }else R(px,py,16,16,'#0d0d14');
  }
  // braziers with living flame
  for(const bx of[5.5*TILE,9.5*TILE]){
    R(bx+3,HUD+2.6*TILE,10,4,C.woodD);
    const f=Math.sin(G.t*11+bx)*1.5;
    R(bx+5+f*.4,HUD+2.6*TILE-8,6,8,C.saf);R(bx+6+f*.4,HUD+2.6*TILE-11,4,5,C.gold);R(bx+7,HUD+2.6*TILE-6,2,3,C.goldL);
  }
  drawElder(7.5*TILE,HUD+1.6*TILE);
  // cave text, Zelda style — white caps, letter by letter while the gift is given
  ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';
  const lines=P.hasSword?['GO WITH PATIENCE, VEL.','THE FOREST IS WATCHING.']:['TAKE THESE, VEL. NO HERO','WALKS THE FOREST UNARMED.'];
  let budget=G.pickupFx?Math.floor(G.pickupFx.t*22):999;
  let li=0;
  for(const ln of lines){
    const show=ln.slice(0,Math.max(0,Math.min(ln.length,budget)));budget-=ln.length;
    ctx.fillText(show,PW/2,HUD+14+li*10);li++;
  }
  ctx.textAlign='left';
  if(!P.hasSword){
    // the gift: sword, shield and bow on stands
    R(5.9*TILE,HUD+4*TILE,14,3,C.wallD);R(7.4*TILE,HUD+4*TILE,14,3,C.wallD);R(9.4*TILE,HUD+4*TILE,14,3,C.wallD);
    R(6.4*TILE,HUD+3.1*TILE,3,12,C.steel);R(6.4*TILE,HUD+3.1*TILE,1,12,C.steelD);R(5.9*TILE,HUD+4.9*TILE,10,2,C.gold);R(6.2*TILE,HUD+5.3*TILE,4,3,C.woodD);
    drawShield(7.55*TILE,HUD+3.0*TILE,1.1,true);
    R(9.6*TILE,HUD+2.9*TILE,2,13,C.wood);R(9.6*TILE,HUD+2.9*TILE,8,2,C.wood);R(9.6*TILE,HUD+4.4*TILE,8,2,C.wood);
    R(10.2*TILE,HUD+3.4*TILE,1,7,C.steel);
  }
}
function drawWorldTiles(ox,oy){
  if(G.area==='over')drawOverTiles(G.sx,G.sy,ox,oy);
  else if(G.area==='dung')drawDungTiles(G.rx,G.ry,ox,oy);

}
function drawEntities(px,py){
  // pickups under everything
  for(const p of pickups)drawPickupAt(p,px,py);
  // dog first (behind Vel)
  drawDog(DOG.x+(px-P.x),DOG.y+(py-P.y)+HUD,DOG.dir,(DOG.frame|0)%2,false);
  if(barkFx>0){ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.fillText('!',DOG.x+(px-P.x)+12,DOG.y+(py-P.y)+HUD-2);}
  // enemies
  for(const e of enemies){
    const ex=e.x+(px-P.x),ey=e.y+(py-P.y)+HUD;
    if(e.type==='boar')drawBoarAt(e,ex,ey);
    else if(e.type==='hawk')drawHawkAt(e,ex,ey);
    else if(e.type==='vaka')drawVakaAt(e,ex,ey);
  }
  // Vel
  const flash=P.invuln>0&&((G.t*18)|0)%2===0;
  if(G.pickupFx){
    // the gift moment: Vel raises the sword high, Zelda style
    drawVel(7.5*TILE-2,HUD+3.4*TILE,'up',0,.1,false,true);
    R(7.5*TILE+5,HUD+3.4*TILE-12,3,10,C.steel);R(7.5*TILE+4,HUD+3.4*TILE-3,6,2,C.gold);
  }else{
    drawVel(px-2,py+HUD-2,P.dir,P.moving?(P.frame|0):0,P.swing,flash,P.hasShield);
  }
  // projectiles
  for(const pr of projs){
    const x=pr.x+(px-P.x),y=pr.y+(py-P.y)+HUD;
    if(pr.dir==='left'||pr.dir==='right'){R(x,y+2,7,1,C.wood);R(x+(pr.dir==='right'?6:-2),y+1,3,3,C.steel);}
    else{R(x+2,y,1,7,C.wood);R(x+1,y+(pr.dir==='down'?6:-2),3,3,C.steel);}
  }
  for(const pr of eprojs){
    const x=pr.x+(px-P.x),y=pr.y+(py-P.y)+HUD;
    R(x+1,y+1,6,6,C.rock);R(x+2,y,4,2,C.rockL);R(x,y+3,8,3,C.rockD);
  }
  for(const s of G.sparks)R(s.x+(px-P.x)-1,s.y+(py-P.y)+HUD-1,2,2,s.c);
  // boss health
  if(bossRef&&!bossRef.dead&&G.area==='dung'){
    R(58,HUD+4,142,7,'#000');R(59,HUD+5,140,5,C.redD);
    R(59,HUD+5,140*Math.max(0,bossRef.hp/bossRef.maxhp),5,C.red);
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('VAKA THE RAKSHASA',PW/2,HUD+18);ctx.textAlign='left';
  }
}
function drawPickupAt(p,px,py){
  const q={kind:p.kind,x:p.x+(px-P.x),y:p.y+(py-P.y)+HUD,t:p.t,stand:p.stand};
  drawPickup(q);
}
function drawBoarAt(e,x,y){const save={x:e.x,y:e.y};e.x=x;e.y=y-HUD;const bk=e.y;e.y=y;drawBoar(e);e.x=save.x;e.y=save.y;}
function drawHawkAt(e,x,y){const gy=e.homeGroundY;e.homeGroundY=gy!==undefined?gy+(y-e.y):undefined;const oy=e.y;e.y=y;drawHawk(e);e.y=oy;e.homeGroundY=gy;}
function drawVakaAt(b,x,y){const ox=b.x,oy=b.y;b.x=x;b.y=y;drawVaka(b);b.x=ox;b.y=oy;}

function drawPlay(){
  R(0,0,PW,VH,'#000');
  const tr=G.trans;
  if(tr&&tr.type==='slide'){
    const p=Math.min(1,tr.t/tr.dur);
    const v=DIRV[tr.dir];
    const ox1=-v[0]*p*PW,oy1=-v[1]*p*PH,ox2=ox1+v[0]*PW,oy2=oy1+v[1]*PH;
    // old screen tiles
    if(tr.kind==='over'){drawOverTiles(tr.osx,tr.osy,ox1,oy1);}else{drawDungTiles(tr.orx,tr.ory,ox1,oy1);}
    // new screen tiles
    if(tr.kind==='over'){drawOverTiles(tr.nsx,tr.nsy,ox2,oy2);}else{drawDungTiles(tr.nrx,tr.nry,ox2,oy2);}
    const px=tr.fx+(tr.tx-tr.fx)*p+ (tr.kind==='over'?-0:0), py=tr.fy+(tr.ty-tr.fy)*p;
    // during scroll, entities: only Vel + dog, positioned in world space of the new screen
    drawDog(px-14,py+HUD+10,DOG.dir,0,false);
    drawVel(px-2,py+HUD-2,P.dir,1,0,P.invuln>0&&((G.t*18)|0)%2===0,P.hasShield);
  }else{
    drawWorldTiles(0,0);
    if(G.area!=='cave')drawEntities(P.x,P.y);
    else{
      for(const pk of pickups)drawPickupAt(pk,P.x,P.y);
      drawDog(DOG.x,DOG.y+HUD,DOG.dir,(DOG.frame|0)%2,false);
      if(G.pickupFx){
        drawVel(7.5*TILE-2,HUD+3.4*TILE,'up',0,.1,false,true);
        R(7.5*TILE+5,HUD+3.4*TILE-12,3,10,C.steel);R(7.5*TILE+4,HUD+3.4*TILE-3,6,2,C.gold);
      }else drawVel(P.x-2,P.y+HUD-2,P.dir,P.moving?(P.frame|0):0,P.swing,P.invuln>0&&((G.t*18)|0)%2===0,P.hasShield);
    }
    if(tr&&tr.type==='fade'){
      const a=tr.t<tr.dur/2?tr.t/(tr.dur/2):1-(tr.t-tr.dur/2)/(tr.dur/2);
      ctx.fillStyle='rgba(0,0,0,'+Math.max(0,Math.min(1,a)).toFixed(2)+')';ctx.fillRect(0,HUD,PW,PH);
    }
  }
  drawHUD();
  if(G.msg&&G.msg.text){
    ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(8,VH-24,PW-16,18);
    ctx.strokeStyle=C.gold;ctx.strokeRect(8.5,VH-23.5,PW-17,17);
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.textAlign='center';
    ctx.fillText(G.msg.text.slice(0,42),PW/2,VH-12);ctx.textAlign='left';
  }
  if(G.paused){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,HUD,PW,PH);
    ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='center';
    ctx.fillText('PAUSED',PW/2,HUD+70);
    ctx.font='bold 8px monospace';ctx.fillStyle=C.hudText;
    ctx.fillText('ARROWS MOVE · Z SWORD · X BOW',PW/2,HUD+92);
    ctx.fillText('ENTER RESUMES',PW/2,HUD+106);ctx.textAlign='left';
  }
}
function heartAt(x,y,fill){ // fill: 1 full, .5 half, 0 empty
  const base=fill===0?'#3a3040':C.red;
  R(x+1,y+1,3,3,base);R(x+5,y+1,3,3,base);R(x+1,y+2,7,2,base);R(x+2,y+4,5,2,base);R(x+3,y+6,3,2,fill===0?'#3a3040':C.redD);
  if(fill===.5){R(x+5,y+1,3,3,'#3a3040');R(x+5,y+2,3,2,'#3a3040');}
  if(fill===1)R(x+2,y+2,2,1,'#ff9a8a');
}
function drawHUD(){
  R(0,0,PW,HUD,'#000');

  R(6,8,46,40,'#101018');ctx.strokeStyle='#8a8aa0';ctx.strokeRect(6.5,8.5,45,39);

  ctx.fillText('x'+String(P.arrows).padStart(2,'0'),70,38);
  R(60,44,5,5,C.gold);R(65,48,2,6,C.gold);
  ctx.fillText('x'+P.keys,70,53);
  // equipment boxes: B bow, A sword, shield
  function box(x,label,has){R(x,10,24,24,'#101018');ctx.strokeStyle=has?C.gold:'#4a4a5e';ctx.strokeRect(x+.5,10.5,23,23);
    ctx.fillStyle='#a9a2c0';ctx.font='bold 6px monospace';ctx.fillText(label,x+2,8+42);}
  box(104,'-B-',P.hasBow);
  if(P.hasBow){R(110,14,2,14,C.wood);R(110,14,9,2,C.wood);R(110,26,9,2,C.wood);R(116,17,1,8,C.steel);}
  box(134,'-A-',P.hasSword);
  if(P.hasSword){R(143,13,3,13,C.steel);R(143,13,1,13,C.steelD);R(140,25,9,2,C.gold);R(142,27,4,3,C.woodD);}
  box(164,'-SH-',P.hasShield);

  if(G.shardGot){R(198,16,2,2,C.goldL);R(196,18,6,3,C.gold);R(194,21,10,3,C.gold);ctx.fillStyle=C.gold;ctx.font='bold 6px monospace';ctx.fillText('ASTRA',192,44);}
  // hearts

  const hearts=Math.ceil(P.maxhp/2);
  for(let i=0;i<hearts;i++){
    const fill=P.hp>=(i*2+2)?1:P.hp===(i*2+1)?.5:0;

/* -------- title / story / over / win -------- */
const STORY=[
 'MANY YEARS AGO, IN THE HALL OF DICE,',
 'A KINGDOM WAS LOST ON A SINGLE THROW.','',
 'THE PRICE: TWELVE YEARS OF EXILE IN',
 'THE FOREST — AND A THIRTEENTH YEAR',
 'SPENT HIDDEN, NAMELESS AND UNSEEN.','',
 'BEFORE THEY VANISHED, THE HEROES HID',
 'THEIR WEAPONS IN A GREAT SHAMI TREE.',
 'THAT HIDING IS THE SHAMI SECRET.','',
 'KATHIRVELAN — CALLED VEL — IS A BOY',
 'OF THE EXILED HOUSE. HIS DOG WALKS',
 'BESIDE HIM, AS ALWAYS.','',
 'YEAR ONE BEGINS IN THE FOREST.',
 'ITS LESSON IS PATIENCE.','',
 'BOARS CHARGE. HAWKS DIVE. AND DEEP IN',
 'THE SHAMI VAULT, VAKA THE RAKSHASA',
 'GUARDS THE FIRST ASTRA SHARD…'
];
function bigText(txt,x,y,size,color,align){
  ctx.font='900 '+size+'px monospace';ctx.textAlign=align||'center';
  ctx.fillStyle='#000';ctx.fillText(txt,x+2,y+2);
  ctx.fillStyle=color;ctx.fillText(txt,x,y);ctx.textAlign='left';
}
function drawTitle(){
  R(0,0,PW,VH,'#0a1408');
  drawOverTiles(1,1,0,-40); // forest backdrop (center screen, HUD area reused)
  ctx.fillStyle='rgba(4,8,4,.55)';ctx.fillRect(0,0,PW,VH);
  // great shami tree
  R(112,18,32,10,C.leafDk);R(96,26,64,16,C.leafD);R(104,24,48,14,C.leaf);R(120,40,16,22,C.woodD);R(125,40,6,22,C.wood);
  bigText('VEL AND THE',PW/2,86,15,C.goldL);
  bigText('SHAMI SECRET',PW/2,112,23,C.gold);
  ctx.fillStyle='#8ad44a';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText('— THE HIDDEN YEAR —',PW/2,130);
  ctx.fillStyle='#efeae0';ctx.font='bold 8px monospace';
  ctx.fillText('YEAR ONE · THE FOREST · LESSON: PATIENCE',PW/2,148);
  ctx.save();ctx.translate(88,168);ctx.scale(2,2);drawVel(0,0,'down',0,0,false,true);ctx.restore();
  ctx.save();ctx.translate(140,176);ctx.scale(2,2);drawDog(0,0,'down',0,false);ctx.restore();
  if(((G.t*1.4)|0)%2===0){ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.fillText('PRESS ENTER · TAP START',PW/2,222);}
  ctx.textAlign='left';
}
function drawStory(){
  R(0,0,PW,VH,'#06060f');
  ctx.fillStyle=C.gold;ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText('VEL AND THE SHAMI SECRET',PW/2,26);
  const total=STORY.length*13+150;
  let y=VH+10-((G.storyT*20)%total);
  ctx.font='bold 8px monospace';
  for(const ln of STORY){
    if(y>44&&y<VH-16){ctx.fillStyle='#efeae0';ctx.fillText(ln,PW/2,y);}
    y+=13;
  }
  ctx.fillStyle='#a9a2c0';ctx.font='bold 7px monospace';
  ctx.fillText('ENTER — BEGIN · THE SCROLL REPEATS',PW/2,VH-6);
  ctx.textAlign='left';
  if(G.storyT> (total-230)/20 + 2){/* allow natural loop */}
}
function drawOver(){
  drawPlay();
  ctx.fillStyle='rgba(10,0,0,.78)';ctx.fillRect(0,0,PW,VH);
  bigText('GAME OVER',PW/2,104,22,C.red);
  ctx.fillStyle='#efeae0';ctx.font='bold 8px monospace';ctx.textAlign='center';
  ctx.fillText('THE FOREST KEEPS ITS SECRET — FOR NOW.',PW/2,128);
  if(((G.t*1.4)|0)%2===0)ctx.fillText('PRESS ENTER TO TRY AGAIN',PW/2,152);
  ctx.textAlign='left';
}
function drawWin(){
  R(0,0,PW,VH,'#0a0a12');
  drawOverTiles(2,0,0,-30);
  ctx.fillStyle='rgba(5,5,10,.6)';ctx.fillRect(0,0,PW,VH);
  R(28,44,PW-56,132,'#101018');ctx.strokeStyle=C.gold;ctx.lineWidth=2;ctx.strokeRect(29,45,PW-58,130);ctx.lineWidth=1;
  // golden astra triangle
  R(124,58,8,4,C.goldL);R(120,62,16,4,C.goldL);R(116,66,24,5,C.gold);R(112,71,32,5,C.gold);R(126,64,4,8,'#fff');
  ctx.textAlign='center';
  ctx.fillStyle=C.gold;ctx.font='900 13px monospace';ctx.fillText('YOU GOT THE ASTRA SHARD!',PW/2,96);
  ctx.fillStyle='#fff';ctx.font='900 12px monospace';
  ctx.fillText('YEAR ONE IS DONE.',PW/2,120);
  ctx.fillText('TWELVE REMAIN.',PW/2,136);
  ctx.fillStyle='#a9a2c0';ctx.font='bold 8px monospace';
  ctx.fillText('COINS x'+P.coins+'  ·  VAKA HAS FALLEN',PW/2,154);
  if(((G.t*1.4)|0)%2===0){ctx.fillStyle='#efeae0';ctx.fillText('ENTER — KEEP EXPLORING THE FOREST',PW/2,168);}

}
function render(){
  if(G.state==='title')drawTitle();
  else if(G.state==='story')drawStory();
  else if(G.state==='over')drawOver();
  else if(G.state==='win')drawWin();
  else drawPlay();
}
/* ================= INPUT ================= */
function respawn(){
  P.hp=P.maxhp;P.invuln=0;P.kbx=P.kby=0;
  G.area='over';G.sx=0;G.sy=2;G.bossSealed=false;
  P.x=8*TILE;P.y=7*TILE;P.dir='down';G.state='play';G.trans=null;
  loadScreen();setMusic('stage');
}
function enterAction(){
  ac();
  if(G.state==='title'){G.state='story';G.storyT=0;setMusic('stage');}
  else if(G.state==='story'){resetGame();}
  else if(G.state==='over'){respawn();}
  else if(G.state==='win'){G.state='play';exitDungeon();}
  else if(G.state==='play'){G.paused=!G.paused;}
}
const KEYMAP={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',
  KeyZ:'strike',Space:'strike',KeyX:'shoot',KeyJ:'strike',KeyK:'shoot'};
addEventListener('keydown',e=>{
  ac();
  if(e.code==='Enter'){enterAction();e.preventDefault();return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(e.code==='KeyP'||e.code==='Escape'){if(G.state==='play')G.paused=!G.paused;return;}
  const k=KEYMAP[e.code];if(k){keys[k]=true;e.preventDefault();}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){keys[k]=false;e.preventDefault();}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();enterAction();});
function bindBtn(el,down,up){
  el.addEventListener('pointerdown',e=>{e.preventDefault();ac();el.classList.add('on');down();});
  const end=e=>{el.classList.remove('on');if(up)up();};
  el.addEventListener('pointerup',end);el.addEventListener('pointerleave',end);el.addEventListener('pointercancel',end);
}
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;bindBtn(el,()=>{keys[k]=true;},()=>{keys[k]=false;});
});
const bSound=document.getElementById('bSound');
function toggleMute(){muted=!muted;bSound.textContent=muted?'SOUND: OFF':'SOUND: ON';if(muted&&AC)AC.suspend();else if(AC)AC.resume();}
bindBtn(document.getElementById('bStart'),()=>enterAction());
bindBtn(document.getElementById('bPause'),()=>{if(G.state==='play')G.paused=!G.paused;});
bindBtn(bSound,()=>toggleMute());
bindBtn(document.getElementById('bRestart'),()=>{ac();resetGame();});
document.getElementById('bPause').addEventListener('click',function(){this.textContent=G.paused?'▶ RESUME':'II PAUSE';});

/* ================= MAIN LOOP ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(G.state==='story')G.storyT+=dt;
  update(dt);
  render();
  const bp=document.getElementById('bPause');
  if(bp)bp.textContent=G.paused?'▶ RESUME':'II PAUSE';
}
setMusic('stage');
requestAnimationFrame(loop);
</script>
